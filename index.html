<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>全屋定制 · 模型审阅</title></head><body><div id="app">
<header><div><strong>全屋定制</strong><span>模型审阅</span></div><div id="status">正在载入模型</div><a href="./output/apartment_v1.blend" download title="下载 Blender 模型"><i data-lucide="download"></i><span>.blend</span></a></header>
<main><div id="viewport"></div><aside><h1>全屋模型</h1><div class="views"><button data-view="axo" title="鸟瞰"><i data-lucide="box"></i></button><button data-view="top" title="俯视"><i data-lucide="layout-grid"></i></button><button data-view="living" title="客厅"><i data-lucide="sofa"></i></button><button data-view="dining" title="餐厅"><i data-lucide="utensils"></i></button><button data-view="master" title="主卧"><i data-lucide="bed-double"></i></button></div>
<h2>房间</h2><select id="room-view" aria-label="房间视角"><option value="axo">全屋</option><option value="entry">入户玄关</option><option value="north">北次卧</option><option value="south">南次卧</option><option value="bath">客卫</option></select><h2>显示</h2><label><input type="checkbox" data-group="01" checked>建筑墙体</label><label><input type="checkbox" data-group="02">吊顶</label><label><input type="checkbox" data-group="03" checked>定制柜体</label><label><input type="checkbox" data-group="04" checked>家具软装</label><label><input type="checkbox" data-group="05">灯具</label><label><input type="checkbox" data-group="06">门窗与窗帘</label><label><input type="checkbox" data-group="07" checked>厨卫设施</label><label><input type="checkbox" id="plan-cut">平面剖切</label><h2>最终成果</h2><a href="./output/02_floor_plan.png" target="_blank">完整俯视图</a>
<h2>选中物体</h2><div id="selection">未选择</div><div id="dimensions"></div><h2>尺寸依据</h2><dl><dt>建筑层高</dt><dd>2900 mm</dd><dt>暂估室内净高</dt><dd>2750 mm</dd><dt>暂估吊顶底高</dt><dd>2450 mm</dd></dl><div class="note">柜体尺寸待现场复核<br>公共区尺寸为估算</div><button id="refresh" title="重新载入模型"><i data-lucide="refresh-cw"></i><span>刷新模型</span></button><a class="notes" href="./README.md" target="_blank">模型说明</a></aside></main><footer><span id="counts">模型准备中</span><span id="updated"></span></footer></div><script type="module" src="/viewer.js"></script></body></html>
